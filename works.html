<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL WORKS — PAVAN Video Portfolio</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="ALL WORKS — Pavan Video Editing & Production Gallery">
    <meta name="description"
        content="Browse Pavan's full collection of video projects: short-form reels, long-form videos, horizontal commercials, and vertical motion edits.">

    <!-- Fonts & Icons -->
    <link
        href="https://api.fontshare.com/v2/css?f[]=clash-display@300,400,500,600,700&f[]=general-sans@300,400,500,600,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- GSAP, ScrollTrigger, and Lenis for Ultra Smooth Scroll -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</head>

<body>

    <!-- Custom Inertia Cursor -->
    <div class="custom-cursor" id="customCursor">
        <span class="cursor-label" id="cursorLabel"></span>
    </div>
    <div class="custom-cursor-dot" id="customCursorDot"></div>

    <!-- Floating Pill Navigation -->
    <nav id="navbar" class="pill-nav">
        <div class="pill-nav-inner">
            <div class="nav-brand">
                <img src="assets/logo.svg" alt="Pavan Logo" class="nav-logo-icon">
                <span class="nav-brand-text">PAVAN</span>
            </div>

            <div class="nav-divider"></div>

            <div class="nav-group">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
                <a href="index.html#reels" class="nav-item"><i class="fa-solid fa-film"></i> Reels</a>
                <a href="works.html" class="nav-item active"><i class="fa-solid fa-grid-2"></i> All Works</a>
                <a href="index.html#about" class="nav-item"><i class="fa-solid fa-user"></i> About</a>
                <a href="index.html#contact" class="nav-item"><i class="fa-solid fa-envelope"></i> Contact</a>
            </div>
        </div>
    </nav>

    <main class="section-container works-page-header">
        <div class="section-header">
            <span class="section-tag">COMPLETE VIDEO CATALOG</span>
            <h2 class="section-title">ALL WORKS</h2>
            <p class="section-subtitle">Filter by format, aspect ratio, or project type</p>
        </div>

        <!-- Filter Category Tabs -->
        <div class="filter-tabs-wrapper">
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="short-form">Short Form / Reels</button>
                <button class="tab-btn" data-filter="long-form">Long Form</button>
                <button class="tab-btn" data-filter="vertical">Vertical (9:16)</button>
                <button class="tab-btn" data-filter="thumbnails">Thumbnails</button>
            </div>
        </div>

        <!-- Dynamic Video Grid -->
        <div class="video-grid" id="videoGrid">
            <!-- Populated via js/works.js -->
        </div>
    </main>

    <!-- Fullscreen Video Lightbox Modal Player -->
    <div class="video-modal-overlay" id="videoModal">
        <div class="video-modal-container">
            <button class="video-modal-close" id="closeModalBtn" aria-label="Close Video"><i
                    class="fa-solid fa-xmark"></i></button>
            <div class="video-modal-body">
                <video id="modalVideo" controls playsinline autoplay></video>
            </div>
            <div class="video-modal-footer">
                <h3 class="video-modal-title" id="modalTitle">Video Title</h3>
                <p class="video-modal-desc" id="modalDesc">Video Description</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="assets/logo.svg" alt="Pavan Logo">
                <span>PAVAN PORTFOLIO</span>
            </div>

            <div class="footer-socials">
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" aria-label="Vimeo"><i class="fa-brands fa-vimeo-v"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>

            <p class="footer-copy">&copy; 2026 PAVAN. All rights reserved.<a href="admin.html" id="secretAdminLock" style="color:inherit; opacity:0.15; text-decoration:none; margin-left:0.5rem;" title="Portal Access"><i class="fa-solid fa-lock" style="font-size:0.7rem;"></i></a></p>
        </div>
    </footer>

    <!-- App Scripts -->
    <script src="js/data.js"></script>
    <script type="module" src="js/works.js"></script>
</body>

</html>
